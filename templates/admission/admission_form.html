<!DOCTYPE html>
<html>

<head>

    <title>College Admission Form</title>

</head>

<body>

    <h1>College Admission Form</h1>

    {% if messages %}

        {% for message in messages %}

            <p>{{ message }}</p>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}

        <h2>Course Selection</h2>

        {{ application_form.as_p }}


        <h2>Academic Details</h2>

        {{ academic_form.as_p }}


        <button type="submit">
            Submit Application
        </button>

    </form>


    <br>

    <a href="{% url 'student_dashboard' %}">
        Back to Dashboard
    </a>

</body>

</html>
