<!DOCTYPE html>
<html>

<head>
    <title>Registration</title>
</head>

<body>

    <h1>College Admission System</h1>

    <h2>Create Account</h2>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>First Name</label>
        <input
            type="text"
            name="first_name"
            required
        >

        <br><br>

        <label>Last Name</label>
        <input
            type="text"
            name="last_name"
            required
        >

        <br><br>

        <label>Username</label>
        <input
            type="text"
            name="username"
            required
        >

        <br><br>

        <label>Email</label>
        <input
            type="email"
            name="email"
            required
        >

        <br><br>

        <label>Password</label>
        <input
            type="password"
            name="password"
            required
        >

        <br><br>

        <label>Confirm Password</label>
        <input
            type="password"
            name="confirm_password"
            required
        >
        <br><br>
        {{ form.captcha }}

        <br><br>

        <button type="submit">
            Create Account
        </button>

    </form>

    <p>
        Already have an account?
        <a href="{% url 'login' %}">
            Login
        </a>
    </p>
    <p>
        Cancel & GO to Home Page...!
        <a href="{% url 'home' %}">
            Home
        </a>
    </p>


</body>

</html>
